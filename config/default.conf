# Portable defaults.  setup.sh writes the installation-specific paths into
# config/taskqueue.conf and never overwrites that file on an update.
STATE_DIR=""                    # 队列持久状态目录；安装时自动写入
LOGS_DIR=""                     # 任务与 daemon 日志目录；安装时自动写入
MAX_CONCURRENT=10                # 同时运行的最大任务数
MAX_TIME_HARD_CAP=0              # 单任务服务端最长秒数；0 表示不设硬上限
KILL_GRACE=5                     # SIGTERM 后等待多久再发送 SIGKILL（秒）

# Task execution identity: HwHiAiUser runs as the submitting user with the
# HwHiAiUser NPU group; root runs every queued task as root.
TASK_EXECUTION_MODE="HwHiAiUser" # 任务权限：HwHiAiUser（提交用户）或 root

# Automatic updates are disabled until an administrator sets a repository URL.
# Credentials must be provided by the host's Git/SSH configuration, never here.
AUTO_UPDATE_REPOSITORY=""       # 自动更新远端；首次安装从 Git origin 自动写入
AUTO_UPDATE_BRANCH="main"       # 自动更新检查的受控 Git 分支
AUTO_UPDATE_IDLE_WAIT_SECONDS=21600 # 拉取后等待队列空闲的最长秒数（6 小时）
AUTO_UPDATE_IDLE_RETRY_SECONDS=300 # 队列忙时重新检查的间隔秒数
USAGE_SAMPLING_ENABLED=false     # 是否采样真实 NPU 利用率；默认关闭
USAGE_SAMPLE_TIMEOUT=5           # 每次 npu-smi 采样的超时秒数

# Comma-separated physical card ids. Empty enables runtime detection.
AVAILABLE_DEVICES=""            # auto 分配可用物理卡号；空值表示自动探测
