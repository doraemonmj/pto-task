# Copy this file to the installed config/taskqueue.conf and edit it there.
# STATE_DIR and LOGS_DIR are filled by setup.sh for the selected tools root.
STATE_DIR=""                    # 队列持久状态目录；通常由安装脚本填写
LOGS_DIR=""                     # 任务与 daemon 日志目录；通常由安装脚本填写
MAX_CONCURRENT=10                # 同时运行的最大任务数
MAX_TIME_HARD_CAP=3600           # 单任务服务端最长秒数；0 表示不设硬上限
KILL_GRACE=5                     # SIGTERM 后等待多久再发送 SIGKILL（秒）
PTOAS_BASE="/usr/local/ptoas"    # 本机 PTOAS 各版本的管理员配置根目录
TASK_EXECUTION_MODE="HwHiAiUser" # 任务权限：HwHiAiUser（提交用户）或 root
AUTO_UPDATE_REPOSITORY="https://github.com/pypto-tools/npu-taskqueue.git" # 自动更新官方远端
AUTO_UPDATE_BRANCH="main"       # 自动更新检查的受控 Git 分支
AUTO_UPDATE_IDLE_WAIT_SECONDS=7200 # 拉取后等待队列空闲的最长秒数（2 小时）
AUTO_UPDATE_IDLE_WAIT_MAX_SECONDS=7200 # 等待硬上限；同时限制旧配置（2 小时）
AUTO_UPDATE_IDLE_RETRY_SECONDS=300 # 队列忙时重新检查的间隔秒数
USAGE_SAMPLING_ENABLED=false     # 是否采样真实 NPU 利用率；默认关闭
USAGE_SAMPLE_TIMEOUT=5           # 每次 npu-smi 采样的超时秒数
AVAILABLE_DEVICES="0,1,2,3,4,5,6,7" # auto 分配允许使用的物理卡号
